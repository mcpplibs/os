[package]
namespace   = "mcpplibs"
name        = "os"
version     = "0.2.4"
description = "mcpplibs.os: a C++ operating-system library over openkal --- processes, files, environment, terminals, directories and local IPC, with compile-time platform constants and a few platform modules."
license     = "Apache-2.0"
authors     = ["mcpplibs"]
repo        = "https://github.com/mcpplibs/os"

# The kernel layer is openkal and only openkal (design 2026-10-26 part 2, D3):
# one implementation per target, in the arrangement that borrows the program's
# own C and C++ runtime. A program that wants the standalone arrangement, or
# the image arrangement of `<arch>-openkal`, selects it in its own manifest.
[dependencies]
openkal = "0.18.0"

[target.linux.dependencies]
openkal-linux = "0.19.0"

[target.macos.dependencies]
openkal-macos = "0.16.0"

[target.windows.dependencies]
openkal-windows = "0.14.0"

# Emscripten (`wasm32-emscripten`): openkal written above the C library, with
# twelve of openkal's fifteen interfaces. `openkal.process', `openkal.exec' and
# `openkal.space' are absent, so a program that starts one fails at link
# naming the symbol; `openkal.task' is present in a `-pthread' link only.
[target.'cfg(os = "emscripten")'.dependencies]
openkal-emscripten = "0.7.0"

[targets.os]
kind = "lib"

# The interface units and the implementations built on openkal are the same on
# every target. What differs is the compile-time constant of the target, the
# services an environment offers outside the kernel (`machine`), and the
# platform modules, which are declared everywhere and defined only on their own
# platform (R5): a misuse is a link error, never a branch at run time.
[build]
sources = ["src/*.cppm", "src/*.cpp"]

# A request to end, over openkal's stop word and its wait: on every target that
# has `openkal.process' and `openkal.task'. Emscripten has neither, and its
# interrupt is src/emscripten/interrupt.cpp.
[target.'cfg(not(os = "emscripten"))'.build]
sources = ["src/kal/interrupt.cpp"]

# The architecture of the build, as a constant beside the platform's.
[target.'cfg(arch = "x86_64")'.build]
sources = ["src/arch/x86_64.cppm"]

[target.'cfg(arch = "aarch64")'.build]
sources = ["src/arch/aarch64.cppm"]

[target.'cfg(arch = "riscv64")'.build]
sources = ["src/arch/riscv64.cppm"]

[target.'cfg(arch = "wasm32")'.build]
sources = ["src/arch/wasm32.cppm"]

[target.linux.build]
sources = ["src/targets/linux.cppm", "src/linux/*.cpp", "src/posix/*.cpp"]

# The kernel's calls (src/linux/kernel.h): the trap of each architecture.
[target.'cfg(all(linux, arch = "x86_64"))'.build]
sources = ["src/linux/arch/x86_64.cpp"]

[target.'cfg(all(linux, arch = "aarch64"))'.build]
sources = ["src/linux/arch/aarch64.cpp"]

[target.'cfg(all(linux, arch = "riscv64"))'.build]
sources = ["src/linux/arch/riscv64.cpp"]

[target.macos.build]
sources = ["src/targets/macos.cppm", "src/macos/*.cpp", "src/posix/*.cpp"]
# libSystem's names the macOS units call (src/macos/darwin.h), allowed to be
# absent from a link whose libSystem is openkal-macos's stub: the loader finds
# them in libSystem. A link against the SDK binds them as usual.
ldflags = ["-Wl,-U,_sysctlbyname", "-Wl,-U,_mach_host_self", "-Wl,-U,_host_page_size",
           "-Wl,-U,_host_statistics64"]

[target.'cfg(all(macos, arch = "x86_64"))'.build]
sources = ["src/macos/arch/x86_64.cpp"]

[target.'cfg(all(macos, arch = "aarch64"))'.build]
sources = ["src/macos/arch/aarch64.cpp"]

[target.windows.build]
sources = ["src/targets/windows.cppm", "src/windows/*.cpp"]

# The standard output is diverted where the C library keeps it: the Microsoft
# C runtime's descriptors, which set the process's standard handles too; or,
# for a C library on openkal (openkal-musl), that library's descriptors and the
# process's standard handles, each kept apart.
[target.'cfg(all(windows, not(c-abi = "musl")))'.build]
sources = ["src/windows/crt/stdio.cpp"]

[target.'cfg(all(windows, c-abi = "musl"))'.build]
sources = ["src/windows/posix/stdio.cpp"]

# EMSCRIPTEN: a wasm module over Emscripten's C library, under node or in a
# page. No platform module is defined; the file system's durability and
# ownership are the C library's (src/posix/fs.cpp), and the rest is
# src/emscripten/.
[target.'cfg(os = "emscripten")'.build]
sources = ["src/targets/emscripten.cppm", "src/emscripten/*.cpp", "src/posix/fs.cpp"]

# AN OK IMAGE (`<arch>-openkal', openkal SPEC clause 12): no implementation
# beneath --- the loader binds the image's `kal_*' --- and no platform module
# defined. `host()' and the conventions are answered when the image is loaded.
[target.'cfg(os = "openkal")'.build]
sources = ["src/targets/openkal.cppm", "src/openkal/*.cpp"]

# The C library, the C++ run-time and the loader of an image are its
# platform's: mcpp 2026.10.27.1 and later select openkal-platform for
# `<arch>-openkal` (mcpp SPEC-013), so this package declares none of them.
