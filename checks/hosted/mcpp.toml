# The package's tests in the arrangement a program over openkal chooses on a
# system's own triple: the C library is openkal-musl and the C++ run-time is
# openkal-llvm-runtime, both above openkal's implementation for that system
# (mcpp docs/24; mcpp design 2026-10-28 §5.4). The units of this package that
# reach the system beside openkal then see musl's headers, POSIX's names and
# the data model and `wchar_t' the C library declares, not the system's SDK.
[package]
name    = "os-check-hosted"
version = "0.1.0"

[toolchain]
default = "llvm@23.1.3"

[dependencies]
os                   = { path = "../.." }
openkal-musl         = { version = "0.22.3", default-features = false, features = ["posix"] }
openkal-llvm-runtime = "0.16.3"

# The tests are the package's own, each reached by an include from
# tests/<name>.cpp here (a test program is a file of the package that runs it).
# CI checks that every test of the package has its counterpart.
